  .apex-icon .cut { fill:#11162a; }
  .sub { color: #aeb6cb; margin: 0; }
  .toolbar {
    display: flex; gap: 12px; flex-wrap: wrap; align-items: center;
    margin: 22px 0 16px;
  }
  .search {
    flex: 1 1 280px; display: flex; gap: 8px;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.13);
    border-radius: 18px; padding: 8px;
    backdrop-filter: blur(18px);
  }
  input {
    width: 100%; border: 0; outline: 0; background: transparent;
    color: white; padding: 10px 12px; font-size: 16px;

  input::placeholder { color: #8f98ad; }
  button {
    border: 0; color: white; cursor: pointer; font: inherit;
  }
  .search button, .favorite-filter {
    border-radius: 13px; padding: 10px 15px;
    background: rgba(255,255,255,.10);
    border: 1px solid rgba(255,255,255,.10);
  }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 9px 14px; border-radius: 999px;

    border: 1px solid rgba(255,255,255,.10);
    color: #c9d0df;
  }
  .chip.active, .favorite-filter.active {
    background: rgba(132,117,255,.25);
    border-color: rgba(160,150,255,.55);
    color: white;
  }
  .status { color: #8f98ad; font-size: 14px; margin: 16px 2px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(245px, 1fr));
    gap: 15px;
  }
  .card {
    position: relative; min-height: 230px; padding: 20px;
    border-radius: 24px;
    background: linear-gradient(145deg, rgba(255,255,255,.16), rgba(255,255,255,.085));
    border: 1px solid rgba(255,255,255,.16);
    box-shadow: 0 20px 55px rgba(0,0,0,.30), 0 5px 16px rgba(0,0,0,.14);
    backdrop-filter: blur(18px);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover { transform: translateY(-6px); border-color: rgba(210,205,255,.48);
    box-shadow: 0 27px 65px rgba(0,0,0,.36), 0 8px 22px rgba(0,0,0,.18), 0 0 18px rgba(255,255,255,.12);
}
  .top { display: flex; justify-content: space-between; align-items: center; }
  .tag {
    font-size: 12px; color: #b7bfff;
    background: rgba(132,117,255,.14);
    padding: 5px 9px; border-radius: 999px;
  }
  .heart {
    width: 38px; height: 38px; border-radius: 50%;
    background: rgba(255,255,255,.07);
    border: 1px solid rgba(255,255,255,.11);
    font-size: 22px; line-height: 1;
  }
  .heart.active { color: #ff5478; background: rgba(255,84,120,.12); }
  .jp { margin-top: 20px; font-size: 30px; font-weight: 800; letter-spacing: .03em; }
  .zh { margin-top: 3px; color: #dbe0ec; font-size: 18px; font-weight: 650; }
  .kana { margin-top: 12px; color: #aab5ff; font-size: 17px; }
  .romaji { color: #8993a9; font-size: 14px; margin-top: 4px; }
  .mnemonic {
    margin-top: 13px; padding: 9px 11px; border-radius: 12px;
    background: rgba(0,0,0,.14); color: #cdd4e5; font-size: 14px;
  }
  .speak {
    margin-top: 15px; width: 100%; padding: 10px 12px;
    border-radius: 13px; background: rgba(255,255,255,.09);
    border: 1px solid rgba(255,255,255,.10);
  }
  .speak:hover, .search button:hover, .favorite-filter:hover, .chip:hover {

  }
  .empty {

  }
  footer { margin-top: 28px; color: #707a91; font-size: 13px; text-align: center; }
  @media (max-width: 600px) {

const grid = document.getElementById("grid");
const search = document.getElementById("search");
const status = document.getElementById("status");
const chips = document.getElementById("chips");
const favBtn = document.getElementById("favBtn");
let currentCategory = "全部";
let onlyFavorites = false;
let favorites = new Set(JSON.parse(localStorage.getItem("jpCheatFavorites") || "[]"));

const categories = ["全部", "戰鬥", "移動", "溝通", "物品", "角色", "技能", "其他"];

function saveFavorites() {
  localStorage.setItem("jpCheatFavorites", JSON.stringify([...favorites]));
}

function renderChips() {
  chips.innerHTML = categories.map(c =>
    `<button class="chip ${c === currentCategory ? "active" : ""}" data-category="${c}">${c}</button>`
  ).join("");
  chips.querySelectorAll(".chip").forEach(btn => {
    btn.addEventListener("click", () => {
      currentCategory = btn.dataset.category;
      renderChips();
      render();
    });
  });
}

function matches(word, q) {
  if (!q) return true;
  const haystack = [
    word.category, word.chinese, word.japanese,
    word.kana, word.romaji, word.mnemonic
  ].join(" ").toLowerCase();
  return haystack.includes(q.toLowerCase());
}

function render() {
  const q = search.value.trim();
  const result = words.filter(w =>
    (currentCategory === "全部" || w.category === currentCategory) &&
    (!onlyFavorites || favorites.has(w.id)) &&
    matches(w, q)
  );

  status.textContent = `顯示 ${result.length} / ${words.length} 個單詞`;

  if (!result.length) {
    grid.innerHTML = `<div class="empty">😿 找不到相關單詞<br><small>試試其他關鍵字吧！</small></div>`;
    return;
  }

  grid.innerHTML = result.map(w => `
    <article class="card">
      <div class="top">
        <span class="tag">${w.category}</span>
        <button class="heart ${favorites.has(w.id) ? "active" : ""}"
          data-fav="${w.id}" aria-label="收藏">${favorites.has(w.id) ? "♥" : "♡"}</button>
      </div>
      <div class="jp">${w.japanese}</div>
      <div class="zh">${w.chinese}</div>
      <div class="kana">${w.kana}</div>
      <div class="romaji">${w.romaji}</div>
      <div class="mnemonic">💡 空耳：${w.mnemonic}</div>
      <button class="speak" data-speak="${w.id}">🔊 播放日文</button>
    </article>
  `).join("");

  grid.querySelectorAll("[data-fav]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.fav;
      favorites.has(id) ? favorites.delete(id) : favorites.add(id);
      saveFavorites();
      render();
    });
  });

  grid.querySelectorAll("[data-speak]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = btn.dataset.speak;
      btn.disabled = true;
      speakWord(id);
      setTimeout(() => { btn.disabled = false; }, 300);
    });
  });
}

// 語音播放使用 kana（假名）作為朗讀來源，避免瀏覽器自行猜漢字讀音。
let japaneseVoices = [];

function loadJapaneseVoices() {
  if (!("speechSynthesis" in window)) return;
  japaneseVoices = speechSynthesis.getVoices().filter(v =>
    /^ja(?:-|_)/i.test(v.lang)
  );
}

if ("speechSynthesis" in window) {
  loadJapaneseVoices();
  speechSynthesis.addEventListener("voiceschanged", loadJapaneseVoices);
}

function pickJapaneseVoice() {
  // 有些瀏覽器第一次執行時 voiceschanged 還沒完成，
  // 所以每次播放前都再抓一次，避免後面的單詞突然沒有聲音。
  const voices = ("speechSynthesis" in window)
    ? speechSynthesis.getVoices()
    : [];
  const available = voices.filter(v => /^ja(?:-|_)/i.test(v.lang));
  if (available.length) japaneseVoices = available;

  if (!japaneseVoices.length) return null;

  // 優先較完整的日文語音名稱；不同裝置能提供的語音會不同，
  // 所以最後仍會退回第一個可用的 ja 語音。
  const preferred = [
    /Google.*日本語/i,
    /Google.*Japanese/i,
    /Microsoft.*Japanese/i,
    /Microsoft.*日本語/i,
    /Kyoko/i,
    /Otoya/i,
    /Nanami/i,
    /Keita/i
  ];

  for (const pattern of preferred) {
    const match = japaneseVoices.find(v => pattern.test(v.name));
    if (match) return match;
  }

  return japaneseVoices[0];
}

function speakWord(id) {
  const word = words.find(w => w.id === id);
  if (!word || !("speechSynthesis" in window)) {
    alert("你的瀏覽器不支援日文語音播放。");
    return;
  }

  speechSynthesis.cancel();

  // 用假名而不是漢字，避免瀏覽器自行猜讀音。
  // 稍微放慢速度、維持正常音高，讓短詞比較自然。
  const text = word.speechText || word.kana;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = "ja-JP";
  utter.rate = 0.95;
  utter.pitch = 1.0;
  utter.volume = 1.0;

  const jpVoice = pickJapaneseVoice();
  if (jpVoice) utter.voice = jpVoice;

  // 某些 Chrome/Windows 語音在 cancel() 後緊接著 speak() 會偶發失效。
  // 先讓語音佇列清乾淨，再播放一次。
  speechSynthesis.cancel();
  setTimeout(() => speechSynthesis.speak(utter), 30);
}

favBtn.addEventListener("click", () => {
  onlyFavorites = !onlyFavorites;
  favBtn.classList.toggle("active", onlyFavorites);
  favBtn.textContent = onlyFavorites ? "♥ 我的收藏" : "♡ 我的收藏";
  render();
});

search.addEventListener("input", render);
document.getElementById("searchBtn").addEventListener("click", render);
search.addEventListener("keydown", e => {
  if (e.key === "Enter") render();
});

renderChips();
render();
</script>
